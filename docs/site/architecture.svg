<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">The layering of PhairPlayRust</title>
<desc id="arch-desc">Five layers, arrows pointing strictly downwards: the applications android, macos and web on top, then the UniFFI bridge, the shared core, the four protocol engines with the discovery layer, and at the bottom the four format crates.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2a2f3d" /></marker></defs>
<text x="40" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a7aec0" letter-spacing="1.6">APPS</text>
<rect x="150" y="20" width="200" height="56" rx="8" fill="#12141c" stroke="#2a2f3d" stroke-width="1.2" />
<text x="250.0" y="44" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e9ecf4">android</text>
<text x="250.0" y="63" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a7aec0">Kotlin shell</text>
<rect x="380" y="20" width="200" height="56" rx="8" fill="#12141c" stroke="#2a2f3d" stroke-width="1.2" />
<text x="480.0" y="44" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e9ecf4">macos</text>
<text x="480.0" y="63" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a7aec0">SwiftUI shell</text>
<rect x="610" y="20" width="200" height="56" rx="8" fill="#12141c" stroke="#a78bfa" stroke-width="1.2" />
<text x="710.0" y="44" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#a78bfa">web</text>
<text x="710.0" y="63" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a7aec0">this dashboard</text>
  <path d="M450 76 v28" stroke="#2a2f3d" stroke-width="1.2" marker-end="url(#tip)" />
<text x="40" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a7aec0" letter-spacing="1.6">PLATFORM</text>
