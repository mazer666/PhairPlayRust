<text x="450.0" y="134" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e9ecf4">phairplay-ffi</text>
<text x="450.0" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a7aec0">UniFFI bridge and DTOs</text>
  <path d="M450 166 v28" stroke="#2a2f3d" stroke-width="1.2" marker-end="url(#tip)" />
<text x="40" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a7aec0" letter-spacing="1.6">CORE</text>
<rect x="300" y="200" width="300" height="56" rx="8" fill="#12141c" stroke="#a78bfa" stroke-width="1.2" />
<text x="450.0" y="224" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#a78bfa">phairplay-core</text>
