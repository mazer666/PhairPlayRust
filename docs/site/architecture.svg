  <path d="M450 346 v28" stroke="#2a2f3d" stroke-width="1.2" marker-end="url(#tip)" />
<text x="40" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a7aec0" letter-spacing="1.6">FORMATS</text>
<rect x="150" y="380" width="150" height="56" rx="8" fill="#12141c" stroke="#2a2f3d" stroke-width="1.2" />
<text x="225.0" y="413" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e9ecf4">plist</text>
