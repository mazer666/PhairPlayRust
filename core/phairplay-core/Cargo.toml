[package]
# WHY: the crates of this workspace are built from the tree of the
# repository and are not published to a registry. The licence is the AGPL
# and the source is the repository.
publish = false
name = "phairplay-core"
description = "Shared core of the PhairPlayRust receiver stack: configuration, capabilities, session lifecycle, media sinks and the job executor."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
# The socket options of the SSDP socket of the core.
socket2 = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
