project:
  name: PhairPlayRust
  baseline_version: "0.1"
  # The state of the code and the state of the evidence are two different
  # things. The code of the five engines, the four format crates, the
  # bridge, the dashboard, the headless receiver and the two native shells
  # is written and tested. The acceptance records of the milestones M1 to M5
  # exist. What is missing is the evidence that only a device can produce:
  # the device test plan.
  product_status: "m5-code-and-acceptance-records-delivered-awaiting-device-tests"
  # The version of the workspace and the release that carries it. The owner
  # of the number is VERSION; the decision belongs to the owner, the process
  # is in docs/releasing/RELEASING.md.
  current_version: "0.3.0"
  current_release: "v0.3.0-alpha.1"
  release_kind: "alpha"
  release_notes: "docs/releasing/RELEASE-NOTES-v0.3.0-alpha.1.md"
  current_milestone: "M5"
  current_milestone_name: "Smart View"
  current_submilestone: null
  completed_milestones:
    - "M0"
  completed_submilestones: []
  in_progress_submilestones: []
  # The milestones whose code is delivered and whose acceptance record is
  # missing. The narrative is in ROADMAP.md.
  milestones_awaiting_acceptance_record: []
  verification:
    workspace_builds: true
    lint_clean: true
    format_clean: true
    tests_passed: 1258
    tests_failed: 0
    tests_ignored: 0
    structural_gates_green: true
    licence_gate_green: true
    documentation_links_green: true
    device_tests: "not-run"
    performance_budgets_measured: "not-run"
    acceptance_record: "docs/acceptance/M5-ACCEPTANCE.md"
    # The gates of the shells are separate from the gate of the workspace:
    # the gate of the workspace builds the crates of Rust and not the shells.
    android_shell_builds: true
    android_shell_tests_passed: 39
    macos_shell_builds: true
    macos_shell_tests_passed: 102
    # The release plan: the trigger of every release and the platform that
    # ships a binary with it. The narrative is in ROADMAP.md.
    release_plan: "ROADMAP.md#the-release-plan"
    # The budgets are not repeated here: the owner of every number is the
    # file of the configuration. A copy of a budget in a second place is a
    # budget that drifts.
    budgets: "config/performance-budgets.toml"
    # The counters of the checks that are not Cargo tests. Every number names
    # the file that carries the evidence.
    shell_checks:
      dashboard_keyboard_checks: 35
      dashboard_layout_checks: 31
      dashboard_measured_contrast_pairs: 38
      android_shell_unit_tests: 39
      android_shell_focus_order_tests: 12
      macos_shell_unit_tests: 101
      macos_shell_focus_tests: 12
      smartview_engine_tests: 103
    sources:
      tests: "cargo build -p phairplay-ffi && cargo test --offline --workspace --no-fail-fast"
      build: "cargo check --offline --workspace"
      dashboard: "docs/audit/tv-web-dashboard.md"
      android: "docs/audit/tv-android-shell.md"
      macos: "docs/audit/tv-macos-shell.md"
      smartview: "docs/audit/smartview-engine-test.log"
      device_tests: "docs/guides/DEVICE_TEST_PLAN.md"
  license: "AGPL-3.0-or-later"
  contribution_model: "DCO"
  # The last time this file was written by hand. The state of the project
  # lives here; the narrative of the milestones lives in ROADMAP.md.
  state_updated: "2026-10-25"

product:
  summary: "A free, open-source, privacy-first receiver for AirPlay 2, Miracast, Google Cast, DLNA/UPnP and Samsung Smart View on the local network."
  principles:
    - "no account"
    - "no telemetry"
    - "no advertising"
    - "no cloud dependency"
    - "local network only"
    - "honest limits, documented from the first line"
    - "operable with a remote control"
    - "runs without a screen"
  explicit_boundaries:
    - id: "EXC-001"
      subject: "FairPlay DRM content"
      statement: "Not decryptable. FairPlay Streaming is Apple's DRM; no open-source receiver can decrypt it."
    - id: "EXC-002"
      subject: "Apple Music in-app audio"
      statement: "Protected on every AirPlay path. The system audio output of the sender is the workaround."
    - id: "EXC-003"
      subject: "HDCP 2.x link protection"
      statement: "Negotiated in the WFD handshake and enforced by the hardware. A session that cannot be protected is refused cleanly."
    - id: "EXC-004"
      subject: "Widevine and PlayReady"
      statement: "Belong to the DRM framework of the device, not to the receiver."
    - id: "EXC-005"
      subject: "Cloud and remote streaming"
      statement: "The receiver is a device on the local network."
    - id: "EXC-006"
      subject: "Publishing the receiver to the internet"
      statement: "The receiver is not designed for a port forwarding and is not hardened against an exposure to the internet."
    - id: "EXC-007"
      subject: "Buffered audio playback (AirPlay mode 103)"
      statement: "Accepted by the handshake, not played back."
    - id: "EXC-008"
      subject: "Several peers on a single-session protocol"
      statement: "AirPlay, Miracast, DLNA and Smart View serve one peer at a time. Google Cast is the documented exception."
    - id: "EXC-009"
      subject: "Transcoding"
      statement: "The receiver decodes what it advertised. It does not transcode a format into another one."
    - id: "EXC-010"
      subject: "Google Cast application identifier"
      statement: "The end-to-end test needs an identifier that is registered with Google. The project does not ship one and does not fake one."
    - id: "EXC-011"
      subject: "The message format of the Samsung Smart View channel"
      statement: "Proprietary and not publicly documented. The discovery and the handshake are implemented; the content of the channel is not."

platforms:
  # The narrative of every platform — the artefact, the installation and the
  # test — is in docs/guides/PLATFORMS.md. This block is the machine
  # readable state of the same thing.
  phase_1:
    android_tv_fire_tv:
      device_class: "Google TV, Fire TV"
      minimum_api_family: "Android 13+ (API 33)"
      primary_abi: "arm64-v8a"
      artifact: "phairplayrust-<version>-android-arm64-v8a-test.apk"
      status: "built-device-test-not-run"
      milestone: "M3"
      note: "The release variant of the shell builds — BUILD SUCCESSFUL — and the package carries the library of the bridge, the Leanback launcher, the nine permissions without a location and without a microphone, and a signature. The APK is signed with a TEST key: the key of a release belongs to the owner of the project. The APK was never installed on a device and the application was never started — it proves that the shell can be BUILT for a television, not that it works on one."
    macos:
      device_class: "Mac"
      minimum: "13"
      architecture: "arm64"
      status: "written-device-test-not-run"
      milestone: "M3"
      note: "The kit of the shell has a green test suite — 102 tests, 0 failures. The SwiftUI part of the application is NOT RUN: the machine of the measurement has no macOS SDK."
  phase_2:
    raspberry_pi:
      device_class: "Raspberry Pi 3 and later, every other aarch64 Linux"
      artifact: "phairplayrust-<version>-raspberry-pi.tar.gz"
      profile: "config/profiles/raspberry-pi.toml"
      installation: "deploy/install.sh --profile raspberry-pi"
      status: "shipped-device-test-not-run"
      entry_condition: "met"
      note: "The board is the device the project was built for: it runs nothing else and sits in the living room. The archive is built and the receiver was started out of it; the device test — the rows that need a sender and the rows that need a measurement — is NOT RUN. On this board the measurement matters more than anywhere else, because it is the slowest device the project supports."
    linux:
      device_class: "a NAS, a mini PC, a desktop, a server"
      artifact: "phairplayrust-<version>-linux-x86_64.tar.gz"
      profile: "config/profiles/generic.toml"
      installation: "deploy/install.sh"
      status: "shipped-device-test-not-run"
      entry_condition: "met"
      note: "The headless receiver with the dashboard. The binary was built and started out of the archive."
    windows:
      device_class: "a Windows computer, a NAS"
      artifact: "phairplayrust-<version>-windows-x86_64.tar.gz"
      status: "built-device-test-not-run"
      entry_condition: "met"
      note: "The binary is built. The installation as a service on Windows is not written yet."
  phase_3:
    meta_quest:
      device_class: "Quest 2, Quest 3, Quest 3S, Quest Pro"
      status: "not-a-target"
      entry_condition: "a way to the Wi-Fi Direct APIs of the platform that does not need a location permission"
      note: "The developer documentation of Meta names minSdkVersion 32 — and on Android 12L and earlier the platform forces ACCESS_FINE_LOCATION onto every application that calls the Wi-Fi Direct APIs, which the Miracast engine does. Lowering minSdk would put a location permission into the manifest and break FR-075. A Quest is also a SENDER and not a receiver: the protocols of that role are implemented for other senders already. The reason is in docs/guides/PLATFORMS.md §4."
    linux_shell:
      device_class: "a Linux desktop"
      status: "planned"
      entry_condition: "a green M4"
      note: "A NATIVE Linux application. The headless receiver on Linux is not that track."

architecture:
  shared_core: "Rust"
  core_crate: "core/phairplay-core"
  platform_bridge: "UniFFI"
  bridge_crate: "platform/phairplay-ffi"
  android_ui: "Kotlin + Jetpack Compose"
  macos_ui: "SwiftUI + AppKit"
  dashboard: "Rust HTTP/WebSocket backend with static assets, loopback only"
  composition_root: "apps/web/src/receiver.rs"
  supervisor: "platform/phairplay-ffi — ReceiverCore"
  engines:
    airplay: "engines/airplay"
    miracast: "engines/miracast"
    cast: "engines/cast"
    dlna: "engines/dlna"
    smartview: "engines/smartview"
    discovery: "engines/discovery"
  formats:
    plist: "formats/plist"
    h264: "formats/h264"
    aac: "formats/aac"
    alac: "formats/alac"
  dependency_direction: "apps/* -> platform/*, core/* ; engines/* -> core/*, formats/* ; formats/* -> nothing"
  build_contract: "docs/design/BUILD-CONTRACT.md"

protocols:
  - name: "airplay"
    display_name: "AirPlay 2"
    service_types: ["_airplay._tcp", "_raop._tcp"]
    carries_video: true
    carries_audio: true
    max_concurrent_peers: 1
    milestone: "M1"
  - name: "miracast"
    display_name: "Miracast"
    service_types: ["_miracast._tcp"]
    carries_video: true
    carries_audio: true
    max_concurrent_peers: 1
    requires_platform_permission: "WFD (Wi-Fi Display)"
    milestone: "M2"
  - name: "cast"
    display_name: "Google Cast"
    service_types: ["_googlecast._tcp"]
    carries_video: true
    carries_audio: true
    max_concurrent_peers: 0
    note: "The Cast protocol allows several senders. The limit is derived from session.multi_peer_protocols, not from a literal."
    milestone: "M2"
  - name: "dlna"
    display_name: "DLNA / UPnP"
    service_types: []
    discovery: "ssdp"
    carries_video: false
    carries_audio: true
    max_concurrent_peers: 1
    note: "The renderer serves audio and pictures."
    milestone: "M2"
  - name: "smartview"
    display_name: "Samsung Smart View"
    service_types: ["_samsungmsf._tcp"]
    discovery: "ssdp"
    carries_video: false
    carries_audio: false
    max_concurrent_peers: 1
    note: "The discovery and the handshake are implemented; the message format of the channel is proprietary and not implemented (EXC-011). The engine is registered with the supervisor. In the default configuration the DLNA renderer holds the SSDP port first, so the Smart View responder cannot open its socket — the run is quoted in ROADMAP.md (M5)."
    milestone: "M5"

milestones:
  M0: "Foundation"
  M1: "AirPlay 2 receiver"
  M2: "Protocol breadth and local control"
  M3: "Native shells"
  M4: "Hardening, interoperability and release readiness"
  M5: "Smart View"

