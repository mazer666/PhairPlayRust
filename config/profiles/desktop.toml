# Device profile: Linux desktop
#
# WHAT: the defaults for a Linux desktop computer that runs the receiver.
#
# WHY: a desktop is the strongest device of this list: an x86_64 CPU with
#      several cores, at least 8 GB of RAM, a network that is usually wired,
#      and a Wi-Fi adapter that may implement Wi-Fi Direct. The profile can
#      therefore keep the product-wide budgets and switch on all four
#      protocols — the desktop is also the device where the user has a
#      screen, so the dashboard is not the only thing that matters here.
#
#      The receiver is still a *receiver*: it runs in the background, it
#      answers the senders in the network, and it holds one session per
#      protocol (Cast is the documented exception and serves several senders
#      at the same time).
#
# EXAMPLE:
#
#   phairplay-web --config config/profiles/desktop.toml
#
#   # or, with the profile name of the receiver:
#   phairplay-web --profile desktop
#
# The file has the shape of `AppConfig`
# (core/phairplay-core/src/config.rs), so it is handed to `--config`
# unchanged. A key that is not in this file keeps the default of the typed
# model; the product-wide numbers live in
# config/performance-budgets.toml and are not repeated here.
#
# The values below are *budgets for this class of device*, not measurements.
# None of them has been measured in this repository.

# ── The identity that is advertised to senders ───────────────────────────────
[device]
# WHY: the name appears in the device picker of every sender in the network.
# It carries the product and the device class, because two receivers in one
# network have to be told apart. The user renames it to the room ("Study")
# as soon as the receiver is installed.
name = "PhairPlay Desktop"
# WHY: the model string names the device class. The receiver does not know
# the hardware of the machine it runs on, and the name must not claim a
# precision the software does not have.
model = "PhairPlay Rust Receiver on a desktop"
# WHY: the manufacturer is the maker of the *software*. The vendor of the
# machine did not make this receiver.
manufacturer = "PhairPlayRust"

# ── Per-protocol defaults ────────────────────────────────────────────────────
[protocols.airplay]
# WHY: AirPlay over the ordinary network is the protocol a household uses
# most, and a desktop with a wired network is the best place for it.
enabled = true
# WHY: the port is pinned to the well-known port of the RTSP control
# channel, so that the firewall rule of the household has a port to name.
# The owner of the number is core/phairplay-core/src/config/ports.rs.
port = 7000

[protocols.miracast]
# WHY: switched on. A desktop has a Wi-Fi adapter, and the adapters of the
# current generation implement Wi-Fi Direct more often than not. The
# protocol stays switched off on a device whose adapter cannot do P2P —
# see the profile of the Raspberry Pi.
enabled = true
port = 7236

[protocols.cast]
# WHY: Google Cast runs over the ordinary network. The control channel is
# TLS, so port 8009 has to be open for the sender.
enabled = true
port = 8009

[protocols.dlna]
# WHY: DLNA is what Windows uses for "Cast to Device" and what VLC offers
# as a renderer. It is discovered with SSDP, not with mDNS.
enabled = true
# WHY: a DLNA renderer has no single TCP port — the description documents
# are served on an ephemeral HTTP port and the announcement travels over
# SSDP on UDP 1900. The port therefore stays unpinned.
port = 0

# ── Resource budgets of this device class ────────────────────────────────────
[performance]
# WHY: 512 MB. A desktop has the memory, and the budget exists to bound the
# receiver — a receiver that grows without limit is a receiver that takes
# the machine away from its owner.
max_memory_mb = 512
# WHY: 60 % of one core. The receiver parses the bitstream and serves the
# network; the decoding of the picture is the job of the platform, and the
# rest of the desktop has to stay usable.
max_cpu_percent = 60
# WHY: the product-wide budgets of the time to the first picture and of the
# frame rate are kept: a desktop CPU reaches them — with the decoder of the
# platform, not with the receiver.
#
# ── Queue budgets of this device class ───────────────────────────────────────
#
# The queue budgets of the product apply unchanged on a desktop and are
# therefore not repeated here — they live in
# config/performance-budgets.toml.
