<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app.title"></title>
    <meta name="description" data-i18n-content="app.description" content="" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/base.css" />
    <link rel="stylesheet" href="assets/layout.css" />
    <link rel="stylesheet" href="assets/cards.css" />
    <link rel="stylesheet" href="assets/panels.css" />
    <script>
      // Set the theme before the first paint so the panel never flashes.
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("phairplayrust-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
        } catch (error) {
          theme = "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script type="module">
      // The wording of the panel comes from the language file. The module
      // script in the head is deferred, so the document is parsed when it
      // runs and the texts are in place before the first paint.
      import { startLanguage } from "./assets/i18n.js";
      startLanguage();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="a11y.skipToDashboard"></a>

    <!-- Icon vocabulary of the project: four abstract, hand-drawn line glyphs.
         No third-party icon set, no vendor logo. -->
    <svg class="visually-hidden" aria-hidden="true" focusable="false">
      <symbol id="glyph-airplay" viewBox="0 0 24 24">
        <rect x="2" y="3" width="20" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M8 20.5h8L12 16.5z" fill="currentColor" />
      </symbol>
      <symbol id="glyph-miracast" viewBox="0 0 24 24">
        <path
          d="M7 3H4a1 1 0 0 0-1 1v3M17 3h3a1 1 0 0 1 1 1v3M21 17v3a1 1 0 0 1-1 1h-3M7 21H4a1 1 0 0 1-1-1v-3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
        <circle cx="12" cy="12" r="2.6" fill="currentColor" />
      </symbol>
      <symbol id="glyph-cast" viewBox="0 0 24 24">
        <path
          d="M5 17.5V6.5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v11"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
        <path d="M8 20.5h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <path d="M8.5 15V11M12 15V8.5M15.5 15v-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="glyph-dlna" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="2.4" fill="currentColor" />
        <circle cx="19" cy="5.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5" />
        <circle cx="19" cy="12" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5" />
        <circle cx="19" cy="18.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M7.4 11 17.2 6M7.4 12h9.8M7.4 13l9.8 5" fill="none" stroke="currentColor" stroke-width="1.4" />
      </symbol>
      <symbol id="glyph-smartview" viewBox="0 0 24 24">
        <rect x="2.5" y="4" width="13" height="10" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5" />
        <rect x="17" y="9" width="4.5" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5" />
        <circle cx="19.25" cy="12.4" r="0.7" fill="currentColor" />
        <path d="M5.5 17h7" fill="none" stroke="currentColor" stroke-width="1.4" />
      </symbol>
    </svg>

    <header class="app-header">
      <div class="app-header__inner">
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 64 64" role="img" aria-label="PhairPlayRust">
            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 32h38" stroke-width="3.5" />
              <path d="M42 32 61 17" stroke-width="3" />
              <path d="M42 32h19" stroke-width="3" />
              <path d="M42 32 61 47" stroke-width="3" />
              <path d="M31 9 12 49h38Z" stroke-width="3.5" />
            </g>
          </svg>
          <span class="brand__text">
            <span class="brand__name">PhairPlayRust</span>
            <span class="brand__tagline" id="brand-tagline" data-i18n="brand.tagline"></span>
            <span class="visually-hidden" id="brand-device"></span>
          </span>
        </div>

        <div class="header__spacer"></div>

        <div class="header__tools">
          <p class="live-pill" id="live-pill" data-link="lost" role="status">
            <span class="live-pill__dot" aria-hidden="true"></span>
            <span id="live-label"></span>
          </p>

          <dl class="build-info" id="build-info">
            <div>
              <dt data-i18n="header.version"></dt>
              <dd id="build-version"></dd>
            </div>
            <div>
              <dt data-i18n="header.commit"></dt>
              <dd id="build-commit"></dd>
            </div>
            <div>
              <dt data-i18n="header.target"></dt>
              <dd id="build-target"></dd>
            </div>
            <div>
              <dt data-i18n="header.uptime"></dt>
              <dd id="build-uptime"></dd>
            </div>
          </dl>

          <button
            class="icon-button"
            id="theme-toggle"
            type="button"
            data-i18n-attr="title:header.theme.toLight"
          >
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path
                d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            <span class="visually-hidden" id="theme-toggle-label" data-i18n="header.theme.toLight"></span>
          </button>
        </div>
      </div>
    </header>

    <main class="shell" id="main">
      <p class="banner" id="api-banner" role="alert" hidden>
        <span class="banner__text" id="api-banner-text"></span>
        <button class="banner__dismiss" id="banner-dismiss" type="button" data-i18n="error.dismiss"></button>
      </p>

      <section class="section" aria-labelledby="protocols-title">
        <div class="section__head">
          <h2 class="section__title" id="protocols-title" data-i18n="section.receivers.title"></h2>
          <p class="section__note" data-i18n="section.receivers.note"></p>
        </div>

        <!-- The hint appears only on a device without a mouse. It is a line
             of text, not an overlay: it never covers the cards and it never
             takes the focus. -->
        <p class="remote-hint" id="remote-hint" role="note" hidden>
          <span class="remote-hint__glyph" aria-hidden="true"></span>
          <span data-i18n="remote.hint"></span>
        </p>

        <div
          class="protocol-grid"
          id="protocol-grid"
          role="group"
          aria-labelledby="protocols-title"
          aria-describedby="protocol-group-hint"
        >
          <p class="visually-hidden" id="protocol-group-hint" data-i18n="a11y.protocolGroup"></p>
          <noscript>
            <p class="empty" data-i18n="a11y.noScript"></p>
          </noscript>
        </div>
      </section>

      <div class="dashboard-grid">
        <section class="panel" aria-labelledby="sessions-title">
          <div class="section__head">
            <h2 class="section__title" id="sessions-title" data-i18n="section.sessions.title"></h2>
            <p class="section__note" id="sessions-count"></p>
          </div>
          <div id="sessions-list"></div>
        </section>

        <section class="panel" aria-labelledby="chart-title">
          <div class="section__head">
            <h2 class="section__title" id="chart-title" data-i18n="section.chart.title"></h2>
            <p class="section__note" id="chart-note" data-i18n="chart.note.fps"></p>
          </div>

          <div class="chart__toolbar">
            <!-- WHY the group: the two buttons are one widget. The arrow
                 keys move between them, the Tab key reaches the group as a
                 whole — the same rule as the cards of the receivers. -->
            <div
              class="segmented"
              id="metric-group"
              role="group"
              data-i18n-attr="aria-label:chart.groupLabel"
            >
              <button
                type="button"
                id="metric-fps"
                data-focus-item
                aria-pressed="true"
                data-i18n="chart.metric.fps"
              ></button>
              <button
                type="button"
                id="metric-bytes"
                data-focus-item
                aria-pressed="false"
                data-i18n="chart.metric.bytes"
              ></button>
            </div>
            <label class="chart__scope" for="chart-scope">
              <span data-i18n="chart.scopeLabel"></span>
              <select id="chart-scope">
                <option value="all" data-i18n="chart.scope.all"></option>
                <option value="airplay" data-i18n="protocol.airplay"></option>
                <option value="miracast" data-i18n="protocol.miracast"></option>
                <option value="cast" data-i18n="protocol.cast"></option>
                <option value="dlna" data-i18n="protocol.dlna"></option>
              </select>
            </label>
          </div>

          <div class="chart__plot">
            <svg
              class="chart__svg"
              id="chart"
              viewBox="0 0 640 280"
              role="img"
              aria-labelledby="chart-title chart-desc"
            >
              <desc id="chart-desc" data-i18n="chart.description"></desc>
            </svg>
          </div>

          <p class="chart__readout" id="chart-readout">
            <span><span data-i18n="chart.readout.current"></span> <b id="chart-current"></b></span>
            <span><span data-i18n="chart.readout.peak"></span> <b id="chart-max"></b></span>
            <span><span data-i18n="chart.readout.average"></span> <b id="chart-mean"></b></span>
          </p>
        </section>
      </div>

      <section class="section" aria-labelledby="codecs-title">
        <div class="section__head">
          <h2 class="section__title" id="codecs-title" data-i18n="section.codecs.title"></h2>
          <p class="section__note" data-i18n="section.codecs.note"></p>
        </div>
        <div class="table-scroll">
          <table class="codec-table">
            <caption class="visually-hidden" data-i18n="table.caption"></caption>
            <thead>
              <tr>
                <th scope="col" data-i18n="table.codec"></th>
                <th scope="col" data-i18n="table.type"></th>
                <th scope="col" data-i18n="table.mime"></th>
                <th scope="col" data-i18n="table.usedBy"></th>
              </tr>
            </thead>
            <tbody id="codec-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span data-i18n="footer.license"></span>
      <span data-i18n="footer.local"></span>
    </footer>

    <!-- The card is the control: it is a button, it carries the state of
         the receiver in `aria-pressed`, and the switch in its head is the
         visible state — not a second, tiny target. -->
    <template id="protocol-card-template">
      <article
        class="card"
        data-protocol=""
        data-focus-item
        role="button"
        tabindex="-1"
        aria-pressed="false"
      >
        <div class="card__head">
          <h3 class="card__name">
            <svg class="card__glyph" aria-hidden="true" focusable="false"><use href="" /></svg>
            <span data-field="name"></span>
          </h3>
          <span class="switch" data-field="switch" aria-hidden="true">
            <span class="switch__track" aria-hidden="true"><span class="switch__knob"></span></span>
            <span class="switch__label" data-field="switch-label"></span>
          </span>
        </div>
        <dl class="card__facts">
          <div class="card__fact">
            <dt data-i18n="card.port"></dt>
            <dd data-field="port"></dd>
          </div>
          <div class="card__fact">
            <dt data-i18n="card.peers"></dt>
            <dd data-field="peers"></dd>
          </div>
        </dl>
        <div class="card__state">
          <p class="state" data-field="state" data-state="unknown">
            <span class="state__glyph" aria-hidden="true"></span>
            <span data-field="state-label"></span>
          </p>
          <p class="state__reason" data-field="reason"></p>
          <p class="visually-hidden" data-field="action"></p>
        </div>
        <div class="counters">
          <div class="counter">
            <span class="counter__label" data-i18n="card.frames"></span>
            <span class="counter__value" data-field="frames"></span>
          </div>
          <div class="counter">
            <span class="counter__label" data-i18n="card.bytes"></span>
            <span class="counter__value" data-field="bytes"></span>
          </div>
          <div class="counter">
            <span class="counter__label" data-i18n="card.loss"></span>
            <span class="counter__value" data-field="loss"></span>
          </div>
        </div>
      </article>
    </template>

    <script type="module" src="assets/dashboard.js"></script>
  </body>
</html>
