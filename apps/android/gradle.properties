# The settings of the Gradle daemon of the Android shell.
#
# WHY: The release build runs R8 (the dexer) and the lint analysis.
# Together they need more memory than a small build host has available, and
# the daemon is killed during the packaging step, which produces a
# truncated APK. A smaller heap keeps the daemon alive.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# The AndroidX libraries are the only ones that are used.
android.useAndroidX=true
android.nonTransitiveRClass=true

# The Kotlin sources follow the official style of the language.
kotlin.code.style=official
