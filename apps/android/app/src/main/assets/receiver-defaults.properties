# The default configuration of the receiver for the Android shell.
#
# WHY: The bridge takes the configuration of the receiver as an argument
# and does not offer a default of its own, so the shell has to build one.
# The values below are the mirror of the documented defaults of the
# repository:
#
#   config/app-defaults.toml         the identity and the protocols
#   config/performance-budgets.toml  the limits and the performance budgets
#
# A change of a value in one of those files must be made here in the same
# change; the rule of the single source of truth of the documentation
# policy of the repository applies to this file as well.
#
# The parser of this file lives in
# `org.phairplay.receiver.bridge.ReceiverDefaults` and rejects a file with
# a missing key instead of falling back to a value of its own.

# The identity that the receiver advertises to the senders.
device.name = PhairPlay
device.model = PhairPlay Rust Receiver
device.manufacturer = PhairPlayRust
device.protocol_version = 1.0

# The protocols. A port of zero means that no port is pinned; the port that
# the engine listens on is reported by the status.
protocol.airplay.enabled = true
protocol.airplay.port = 0
protocol.airplay.require_pin = false
protocol.miracast.enabled = true
protocol.miracast.port = 0
protocol.miracast.require_pin = false
protocol.cast.enabled = true
protocol.cast.port = 0
protocol.cast.require_pin = false
protocol.dlna.enabled = true
protocol.dlna.port = 0
protocol.dlna.require_pin = false
protocol.smartview.enabled = true
protocol.smartview.port = 0
protocol.smartview.require_pin = false

# The limits of the untrusted network input.
limits.video_queue_frames = 90
limits.video_queue_bytes = 67108864
limits.audio_queue_packets = 200
limits.audio_queue_bytes = 4194304
limits.max_pairing_attempts = 5
limits.max_artwork_bytes = 8388608
limits.max_photo_bytes = 20971520
limits.max_media_bytes = 536870912
limits.max_header_count = 64
limits.max_header_bytes = 8192

# The protocols that may serve more than one peer at the same time. The rule
# lives in the configuration and nowhere else.
session.multi_peer_protocols = cast

# The performance budgets that the implementation is measured against.
performance.first_frame_latency_ms = 100
performance.minimum_fps = 25
performance.max_memory_mb = 150
performance.max_cpu_percent = 30
performance.idle_timeout_ms = 30000
