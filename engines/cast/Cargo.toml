[package]
# WHY: the crates of this workspace are built from the tree of the
# repository and are not published to a registry. The licence is the AGPL
# and the source is the repository.
publish = false
name = "phairplay-cast"
description = "The Google Cast receiver engine of PhairPlayRust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
phairplay-core = { path = "../../core/phairplay-core" }
phairplay-plist = { path = "../../formats/plist" }

# Async runtime and the engine trait.
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = { workspace = true }
thiserror = { workspace = true }

# The CastV2 payloads are JSON, the device identity is hashed.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

# The CastV2 transport is TLS. `ring` is the only crypto backend that builds
# without a C toolchain beyond a C compiler, so it is pinned here.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }

# Service discovery: `_googlecast._tcp` over DNS-SD.
mdns-sd = { workspace = true }
if-addrs = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
