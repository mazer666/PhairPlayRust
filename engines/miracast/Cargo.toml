[package]
# WHY: the crates of this workspace are built from the tree of the
# repository and are not published to a registry. The licence is the AGPL
# and the source is the repository.
publish = false
name = "phairplay-miracast"
description = "The Miracast (Wi-Fi Display) sink engine of PhairPlayRust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
phairplay-core = { path = "../../core/phairplay-core" }

# Async runtime and the engine trait.
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = { workspace = true }
thiserror = { workspace = true }

# The sink answers with a plain text body.
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
